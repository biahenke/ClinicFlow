    .form-control { background: #0b1221; border: 1px solid #1e293b; color: white; padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.85rem; width: 100%; transition: 0.2s; }
    .form-control:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    
    .modal-container { background: #131c31; color: #e2e8f0; border: 1px solid #1e293b; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .modal-header { border-bottom: 1px solid #1e293b; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; }

    .btn-secondary { background: transparent; color: #94a3b8; border: 1px solid #334155; padding: 0.5rem 1rem; border-radius: 0.75rem; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
    .btn-secondary:hover { background: #1e293b; color: white; }
    .btn-primary { background: #3b82f6; color: white; border: none; padding: 0.5rem 1.25rem; border-radius: 0.75rem; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
    .btn-primary:hover { background: #2563eb; }
    
    label.form-label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; font-weight: 500; }
  </style>
</head>

  <!-- MAIN AREA -->
  <div class="flex-1 flex flex-col overflow-hidden bg-[#0b1221]">
    
    <!-- TOP HEADER -->

        <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 shrink-0"></i>
        <input type="text" placeholder="Buscar..." class="w-[300px] bg-[#131c31] border border-[#1e293b] rounded-full py-2 pl-12 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
      </div>
      
      <div class="flex items-center gap-6">
        <button class="relative text-slate-400 hover:text-white transition">
          <i class="ph ph-bell text-2xl shrink-0"></i>
        </button>
        <div class="flex items-center gap-3 border-l border-[#1e293b] pl-6 cursor-pointer">
          <div class="w-10 h-10 rounded-full bg-cyan-400 text-slate-900 flex items-center justify-center font-bold text-lg" id="avatar-initial">U</div>
        </div>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="flex-1 overflow-y-auto p-8 pt-2 flex flex-col gap-6 relative">
      <div class="flex justify-between items-center shrink-0">
        <div>
          <h1 class="text-3xl font-bold text-white tracking-tight">Médicos</h1>
          <p class="text-sm text-slate-400 mt-1">Gestão do corpo clínico e especialidades.</p>
        </div>
        <div>
          
        </div>
      </div>
      
      <div class="dark-card flex-1 flex flex-col overflow-hidden">
        <div class="overflow-y-auto flex-1">
          

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CRM</th>
                                <th>Especialidade</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="medicos-table-body">
                            <tr><td colspan="4" style="text-align: center;">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination-container" id="pagination-medicos"></div>
            
        </div>
      </div>
    </main>
  </div>
  
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    
        

        const limit = 10;
        let currentPage = 1;

        async function carregarMedicos(pagina = 1) {
            const token = localStorage.getItem('token');
            if (!token) return;

            currentPage = pagina;
            const skip = (pagina - 1) * limit;

            try {
                const response = await window.api.getMedicos(skip, limit);
                const medicos = response.items;
                const total = response.total;

                const tbody = document.getElementById('medicos-table-body');
                tbody.innerHTML = '';
                
                if (medicos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Nenhum médico cadastrado.</td></tr>';
                } else {
                    medicos.forEach(m => {
                        const tr = document.createElement('tr');
                        const statusClass = m.user.is_active ? 'success' : 'error';
                        const statusText = m.user.is_active ? 'Ativo' : 'Inativo';
                        
                        tr.innerHTML = `
                            <td>
                                <div style="display: flex; align-items: center; gap: 0.75rem;">
                                    <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--secondary); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold;">
                                        ${m.user.nome.charAt(0).toUpperCase()}
                                    </div>
                                    <span style="font-weight: 500; color: white;">${m.user.nome}</span>
                                </div>
                            </td>
                            <td>${m.crm}</td>
                            <td>${m.especialidade}</td>
                            <td><span class="badge badge-${statusClass}">${statusText}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
                window.renderPagination('pagination-medicos', total, limit, currentPage, carregarMedicos);
            } catch (error) {
                console.error(error);
                showToast('Erro ao carregar médicos', 'error');
            }
        }

        async function carregarEspecialidades() {
            try {
                const resp = await window.api.getEspecialidades();
                const sel = document.getElementById('m_especialidade_id');
                sel.innerHTML = '<option value="">Selecione uma especialidade...</option>';
                if (resp && resp.length) {
                    resp.forEach(e => {
                        const opt = document.createElement('option');
                        opt.value = e.id;
                        opt.textContent = e.nome;
                        sel.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarMedicos();
            carregarEspecialidades();
        });

        // Modal Logic
        const modal = document.getElementById('medicoModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtns = document.querySelectorAll('.modal-close, .modal-close-btn');

        if (openBtn) {
            openBtn.addEventListener('click', () => modal.classList.add('active'));
        }
        
        closeBtns.forEach(btn => btn.addEventListener('click', () => {
            modal.classList.remove('active');
            document.getElementById('formMedico').reset();
        }));

        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        document.getElementById('formMedico').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                // 1. Criar o usuário base
                const userData = {
                    nome: document.getElementById('m_nome').value,
                    email: document.getElementById('m_email').value,
                    senha: document.getElementById('m_senha').value,
                    role: 'MEDICO',
                    ativo: true
                };
                const userResp = await window.api.register(userData);

                // 2. Criar o médico vinculado ao ID retornado
                const medData = {
                    usuario_id: userResp.id,
                    especialidade_id: parseInt(document.getElementById('m_especialidade_id').value),
                    crm: document.getElementById('m_crm').value,
                    telefone: document.getElementById('m_telefone').value
                };
                
                await window.api.createMedico(medData);
                showToast('Médico criado com sucesso!', 'success');
                modal.classList.remove('active');
                e.target.reset();
                setTimeout(() => window.location.reload(), 1000);
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    
  </script>
