<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ClinicFlow</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .login-logo {
            width: 56px;
            height: 56px;
            background: var(--secondary);
            color: var(--primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            font-weight: bold;
            margin: 0 auto 1.5rem auto;
        }
        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        .btn-full {
            width: 100%;
            padding: 0.875rem;
            margin-top: 1rem;
        }
        .error-message {
            background: var(--error-bg);
            color: var(--error-text);
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">C</div>
            <h1>ClinicFlow</h1>
            <p>Bem-vindo ao sistema de gestão médica moderno.</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email" class="form-label">E-mail</label>
                <div style="position: relative;">
                    <i data-lucide="mail" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-light); width: 18px; height: 18px;"></i>
                    <input type="email" id="email" class="form-control" style="padding-left: 2.75rem;" required placeholder="seu@email.com">
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Senha</label>
                <div style="position: relative;">
                    <i data-lucide="lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-light); width: 18px; height: 18px;"></i>
                    <input type="password" id="password" class="form-control" style="padding-left: 2.75rem;" required placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Entrar na Plataforma</button>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        lucide.createIcons();
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMessage');
            
            try {
                errorEl.style.display = 'none';
                const response = await window.api.login(email, password);
                localStorage.setItem('token', response.access_token);
                localStorage.setItem('role', response.role);
                window.location.href = '/dashboard.html';
            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
