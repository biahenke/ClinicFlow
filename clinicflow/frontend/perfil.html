<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil e Segurança - ClinicFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #000f24; color: #94a3b8; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    .sidebar-item { padding: 0.75rem 1rem; border-radius: 0.75rem; display: flex; align-items: center; gap: 1rem; font-weight: 500; transition: 0.3s; color: #cbd5e1; margin: 0 1rem; }
    .sidebar-item:hover { background: rgba(255,255,255,0.05); color: white; }
    .sidebar-item.active { background: linear-gradient(90deg, #3b82f6, #2563eb); color: white; font-weight: 600; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    
    .dark-card { background: #001b3a; border-radius: 1rem; border: 1px solid #002d5c; padding: 1.75rem; }

    /* ── Form Inputs ── */
    .pf-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .pf-input {
      width: 100%;
      padding: 0.7rem 1rem;
      background: #00112a;
      border: 1px solid #0e3a6e;
      border-radius: 0.65rem;
      color: #e2e8f0;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .pf-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .pf-input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .pf-input::placeholder {
      color: #475569;
    }

    /* ── Buttons ── */
    .btn-save {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.5rem;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      border: none;
      border-radius: 0.65rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    .btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
    }
    .btn-save:active { transform: translateY(0); }

    .btn-danger {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.5rem;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      border: none;
      border-radius: 0.65rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
    }
    .btn-danger:active { transform: translateY(0); }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 2rem; right: 2rem;
      padding: 0.85rem 1.5rem;
      border-radius: 0.75rem;
      color: #fff;
      font-weight: 500;
      font-size: 0.85rem;
      z-index: 9999;
      animation: slideIn 0.3s ease-out;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .toast.success { background: linear-gradient(135deg, #10b981, #059669); }
    .toast.error   { background: linear-gradient(135deg, #ef4444, #dc2626); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body class="h-screen overflow-hidden flex">

  <!-- LEFT SIDEBAR -->
  <aside class="group w-[80px] hover:w-[260px] transition-all duration-300 bg-[#000f24] border-r border-[#002d5c] flex flex-col shrink-0 z-50 h-full overflow-hidden">
    <div class="h-24 flex items-center px-6 overflow-hidden">
      <div class="flex items-center">
        <i class="ph-fill ph-heartbeat text-4xl text-blue-500 shrink-0"></i>
        <div class="flex flex-col">
          <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 text-white font-bold text-xl leading-tight">ClinicFlow</span><span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 text-[0.65rem] text-slate-400 font-semibold tracking-widest">GESTÃO DE SAÚDE</span>
        </div>
      </div>
    </div>
    
    <nav class="flex flex-col gap-2 mt-4 flex-1">
      <a href="dashboard.html" class="sidebar-item"><i class="ph ph-house text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Início</span></a>
      <a href="pacientes.html" class="sidebar-item"><i class="ph ph-users text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Pacientes</span></a>
      <a href="medicos.html" class="sidebar-item"><i class="ph ph-user-circle-plus text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Médicos</span></a>
      <a href="consultas.html" class="sidebar-item"><i class="ph ph-calendar-plus text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Consultas</span></a>
      <a href="relatorios.html" class="sidebar-item"><i class="ph ph-chart-bar text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Relatórios</span></a>
      <a href="perfil.html" class="sidebar-item active"><i class="ph ph-user text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Perfil</span></a>
      <a href="admin-users.html" class="sidebar-item admin-only"><i class="ph ph-shield text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Admin</span></a>
    </nav>
    
    <div class="p-6">
      <a href="#" class="sidebar-item !mx-0 !px-0 flex items-center gap-3">
        <i class="ph ph-headset text-2xl text-slate-400 shrink-0"></i>
        <div class="flex flex-col">
          <span class="text-white font-medium text-sm opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Suporte</span>
          <span class="text-xs text-slate-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Precisa de ajuda?</span>
        </div>
      </a>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <div class="flex-1 flex flex-col overflow-hidden">
    
    <!-- TOP HEADER -->
    <header class="h-20 px-8 flex items-center justify-end shrink-0">
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-3 border-l border-[#002d5c] pl-6 cursor-pointer">
          <div class="w-10 h-10 rounded-full bg-cyan-400 text-slate-900 flex items-center justify-center font-bold text-lg" id="avatar-initial">U</div>
        </div>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="flex-1 overflow-y-auto p-8 pt-2 flex flex-col gap-6 relative">
      <div class="flex justify-between items-center shrink-0">
        <div>
          <h1 class="text-3xl font-bold text-white tracking-tight">Perfil e Segurança</h1>
          <p class="text-sm text-slate-400 mt-1">Gerencie seus dados pessoais e senha de acesso.</p>
        </div>
      </div>

      <!-- Avatar Banner -->
      <div class="dark-card flex items-center gap-6">
        <div class="w-20 h-20 rounded-full bg-gradient-to-br from-cyan-400 to-blue-500 flex items-center justify-center text-3xl font-bold text-white shadow-lg shadow-blue-500/20" id="avatar-large">U</div>
        <div class="flex flex-col">
          <span class="text-xl font-bold text-white" id="display-nome">Carregando...</span>
          <span class="text-sm text-slate-400" id="display-email">—</span>
          <span class="mt-1.5 inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1 rounded-full w-fit" id="display-role-badge" style="background: rgba(59,130,246,0.15); color: #60a5fa;">
            <i class="ph-fill ph-shield-check"></i> <span id="display-role-text">—</span>
          </span>
        </div>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1">
        
        <!-- DADOS PESSOAIS -->
        <div class="dark-card flex flex-col gap-5">
          <h2 class="text-lg font-bold text-white flex items-center gap-2"><i class="ph ph-identification-card text-sky-400 text-xl"></i>Dados Pessoais</h2>
          <form id="formPerfil" class="flex flex-col gap-4">
            <div>
              <label class="pf-label" for="perfil_nome">Nome Completo</label>
              <input type="text" id="perfil_nome" class="pf-input" required placeholder="Seu nome completo">
            </div>
            <div>
              <label class="pf-label" for="perfil_email">E-mail</label>
              <input type="email" id="perfil_email" class="pf-input" required placeholder="seu@email.com">
            </div>
            <div>
              <label class="pf-label" for="perfil_role">Função</label>
              <input type="text" id="perfil_role" class="pf-input" readonly disabled>
            </div>
            <div class="mt-2 flex justify-end">
              <button type="submit" class="btn-save"><i class="ph ph-floppy-disk"></i> Salvar Dados</button>
            </div>
          </form>
        </div>

        <!-- SEGURANÇA -->
        <div class="dark-card flex flex-col gap-5">
          <h2 class="text-lg font-bold text-white flex items-center gap-2"><i class="ph ph-lock-key text-rose-400 text-xl"></i>Segurança</h2>
          <form id="formSenha" class="flex flex-col gap-4">
            <div>
              <label class="pf-label" for="senha_atual">Senha Atual</label>
              <input type="password" id="senha_atual" class="pf-input" required placeholder="••••••••">
            </div>
            <div>
              <label class="pf-label" for="nova_senha">Nova Senha</label>
              <input type="password" id="nova_senha" class="pf-input" required placeholder="••••••••">
            </div>
            <div>
              <label class="pf-label" for="confirma_senha">Confirmar Nova Senha</label>
              <input type="password" id="confirma_senha" class="pf-input" required placeholder="••••••••">
              <span id="senha_erro" class="text-xs text-rose-400 mt-1 hidden">As senhas não coincidem.</span>
            </div>
            <div class="mt-2 flex justify-end">
              <button type="submit" class="btn-danger"><i class="ph ph-shield-check"></i> Alterar Senha</button>
            </div>
          </form>
        </div>

      </div>
    </main>
  </div>
  
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function showToast(msg, type = 'success') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const user = await window.api.getMe();
            document.getElementById('perfil_nome').value = user.nome;
            document.getElementById('perfil_email').value = user.email;
            document.getElementById('perfil_role').value = user.role.toUpperCase();
            const initial = user.nome.charAt(0).toUpperCase();
            document.getElementById('avatar-initial').textContent = initial;
            document.getElementById('avatar-large').textContent = initial;
            document.getElementById('display-nome').textContent = user.nome;
            document.getElementById('display-email').textContent = user.email;
            document.getElementById('display-role-text').textContent = user.role.toUpperCase();

            // Color badge by role
            const badge = document.getElementById('display-role-badge');
            const roleColors = {
              admin: { bg: 'rgba(139, 92, 246, 0.15)', color: '#a78bfa' },
              medico: { bg: 'rgba(16, 185, 129, 0.15)', color: '#34d399' },
              recepcionista: { bg: 'rgba(251, 191, 36, 0.15)', color: '#fbbf24' },
              paciente: { bg: 'rgba(59, 130, 246, 0.15)', color: '#60a5fa' },
            };
            const rc = roleColors[user.role] || roleColors.paciente;
            badge.style.background = rc.bg;
            badge.style.color = rc.color;
        } catch (error) {
            console.error(error);
            showToast('Erro ao carregar perfil', 'error');
        }

        document.getElementById('formPerfil').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('perfil_nome').value;
            const email = document.getElementById('perfil_email').value;

            try {
                await window.api.updateMe({ nome, email });
                showToast('Perfil atualizado com sucesso', 'success');
                document.getElementById('display-nome').textContent = nome;
                document.getElementById('display-email').textContent = email;
                document.getElementById('avatar-large').textContent = nome.charAt(0).toUpperCase();
                document.getElementById('avatar-initial').textContent = nome.charAt(0).toUpperCase();
            } catch (error) {
                showToast(error.message, 'error');
            }
        });

        const senhaAtual = document.getElementById('senha_atual');
        const novaSenha = document.getElementById('nova_senha');
        const confirmaSenha = document.getElementById('confirma_senha');
        const senhaErro = document.getElementById('senha_erro');

        const validatePasswords = () => {
            if (novaSenha.value && confirmaSenha.value && novaSenha.value !== confirmaSenha.value) {
                senhaErro.classList.remove('hidden');
                return false;
            } else {
                senhaErro.classList.add('hidden');
                return true;
            }
        };

        novaSenha.addEventListener('input', validatePasswords);
        confirmaSenha.addEventListener('input', validatePasswords);

        document.getElementById('formSenha').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!validatePasswords()) {
                showToast('As senhas não coincidem', 'error');
                return;
            }

            try {
                await window.api.changePassword({
                    current_password: senhaAtual.value,
                    new_password: novaSenha.value,
                    confirm_password: confirmaSenha.value
                });
                showToast('Senha alterada com sucesso', 'success');
                senhaAtual.value = '';
                novaSenha.value = '';
                confirmaSenha.value = '';
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    });
  </script>
</body>
</html>
