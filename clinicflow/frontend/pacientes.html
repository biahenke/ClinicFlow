<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes - ClinicFlow</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-icon">C</div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-link" data-tooltip="Dashboard">
                    <i data-lucide="layout-dashboard"></i>
                </a>
                <a href="pacientes.html" class="nav-link active" data-tooltip="Pacientes">
                    <i data-lucide="users"></i>
                </a>
                <a href="medicos.html" class="nav-link admin-only" data-tooltip="Médicos">
                    <i data-lucide="stethoscope"></i>
                </a>
                <a href="consultas.html" class="nav-link" data-tooltip="Consultas">
                    <i data-lucide="calendar"></i>
                </a>
                <a href="admin-users.html" class="nav-link admin-only" data-tooltip="Utilizadores">
                    <i data-lucide="shield"></i>
                </a>
            </nav>
            <div class="sidebar-bottom">
                <a href="#" class="nav-link" data-tooltip="Sair" onclick="logout()">
                    <i data-lucide="log-out"></i>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-area" style="grid-column: 2 / span 2;">
            <header class="main-header">
                <div class="welcome-text">
                    <h1>Pacientes</h1>
                    <p>Gerencie o cadastro e histórico dos pacientes.</p>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button class="btn btn-primary" id="openModalBtn">
                        <i data-lucide="plus" style="width:16px;height:16px;"></i> Novo Paciente
                    </button>
                    <button class="btn-icon"><i data-lucide="bell"></i></button>
                </div>
            </header>

            <div class="content-panel">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Data de Nasc.</th>
                                <th>Telefone</th>
                            </tr>
                        </thead>
                        <tbody id="pacientes-table-body">
                            <tr><td colspan="4" style="text-align: center;">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination-container" id="pagination-pacientes"></div>
            </div>
        </main>
    </div>

    <!-- Modal Novo Paciente -->
    <div class="modal-overlay" id="pacienteModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Novo Paciente</h3>
                <button class="modal-close"><i data-lucide="x"></i></button>
            </div>
            <form id="formPaciente">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" id="p_nome" class="form-control" required placeholder="Nome do Paciente">
                    </div>
                    <div class="form-group">
                        <label class="form-label">E-mail</label>
                        <input type="email" id="p_email" class="form-control" required placeholder="paciente@exemplo.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Senha</label>
                        <input type="password" id="p_senha" class="form-control" required placeholder="Senha de acesso">
                    </div>
                    <div class="form-group">
                        <label class="form-label">CPF</label>
                        <input type="text" id="p_cpf" class="form-control" required placeholder="000.000.000-00">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Data de Nascimento</label>
                        <input type="date" id="p_data_nascimento" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Telefone</label>
                        <input type="text" id="p_telefone" class="form-control" placeholder="(00) 00000-0000">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-close-btn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        lucide.createIcons();
        
        const limit = 10;
        let currentPage = 1;

        async function carregarPacientes(pagina = 1) {
            const token = localStorage.getItem('token');
            if (!token) return;

            currentPage = pagina;
            const skip = (pagina - 1) * limit;

            try {
                const response = await window.api.getPacientes(skip, limit);
                const pacientes = response.items;
                const total = response.total;

                const tbody = document.getElementById('pacientes-table-body');
                tbody.innerHTML = '';
                
                if (pacientes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Nenhum paciente cadastrado.</td></tr>';
                } else {
                    pacientes.forEach(p => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>
                                <div style="display: flex; align-items: center; gap: 0.75rem;">
                                    <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold;">
                                        ${p.user.nome.charAt(0).toUpperCase()}
                                    </div>
                                    <span style="font-weight: 500; color: var(--text-main);">${p.user.nome}</span>
                                </div>
                            </td>
                            <td>${p.cpf}</td>
                            <td>${p.data_nascimento.split('-').reverse().join('/')}</td>
                            <td>${p.telefone || '-'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
                
                window.renderPagination('pagination-pacientes', total, limit, currentPage, carregarPacientes);
            } catch (error) {
                console.error(error);
                showToast('Erro ao carregar pacientes', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarPacientes();
        });

        // Modal Logic
        const modal = document.getElementById('pacienteModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtns = document.querySelectorAll('.modal-close, .modal-close-btn');

        openBtn.addEventListener('click', () => modal.classList.add('active'));
        
        closeBtns.forEach(btn => btn.addEventListener('click', () => {
            modal.classList.remove('active');
            document.getElementById('formPaciente').reset();
        }));

        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        document.getElementById('formPaciente').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                // 1. Criar o usuário base
                const userData = {
                    nome: document.getElementById('p_nome').value,
                    email: document.getElementById('p_email').value,
                    senha: document.getElementById('p_senha').value,
                    role: 'PACIENTE',
                    ativo: true
                };
                const userResp = await window.api.register(userData);

                // 2. Criar o paciente vinculado ao ID retornado
                const pacData = {
                    usuario_id: userResp.id,
                    cpf: document.getElementById('p_cpf').value,
                    data_nascimento: document.getElementById('p_data_nascimento').value,
                    telefone: document.getElementById('p_telefone').value
                };
                await window.api.createPaciente(pacData);
                showToast('Paciente criado com sucesso!', 'success');
                modal.classList.remove('active');
                e.target.reset();
                // Reload page or list
                setTimeout(() => window.location.reload(), 1000);
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    </script>
</body>
</html>
