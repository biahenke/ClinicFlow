<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes - Clínica Vida</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0b1221; color: #94a3b8; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    .sidebar-item { padding: 0.75rem 1rem; border-radius: 0.75rem; display: flex; align-items: center; gap: 1rem; font-weight: 500; transition: 0.3s; color: #cbd5e1; margin: 0 1rem; }
    .sidebar-item:hover { background: rgba(255,255,255,0.05); color: white; }
    .sidebar-item.active { background: linear-gradient(90deg, #3b82f6, #2563eb); color: white; font-weight: 600; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    
    .dark-card { background: #131c31; border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; }
    
    .table { width: 100%; border-collapse: collapse; }
    .table th { color: #94a3b8; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; padding: 1rem; text-align: left; border-bottom: 1px solid #1e293b; }
    .table td { padding: 1.25rem 1rem; font-size: 0.85rem; color: #cbd5e1; border-bottom: 1px solid #1e293b; }
    .table tr:hover td { background: rgba(255,255,255,0.02); }
    
    .badge-success { background: rgba(16,185,129,0.15); color: #34d399; font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 99px; font-weight: 600; }
    .badge-error { background: rgba(244,63,94,0.15); color: #fb7185; font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 99px; font-weight: 600; }
    
    .form-control { background: #0b1221; border: 1px solid #1e293b; color: white; padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.85rem; width: 100%; transition: 0.2s; }
    .form-control:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    
    .modal-container { background: #131c31; color: #e2e8f0; border: 1px solid #1e293b; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .modal-header { border-bottom: 1px solid #1e293b; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .modal-footer { border-top: 1px solid #1e293b; padding: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem; }
    
    .btn-secondary { background: transparent; color: #94a3b8; border: 1px solid #334155; padding: 0.5rem 1rem; border-radius: 0.75rem; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
    .btn-secondary:hover { background: #1e293b; color: white; }
    .btn-primary { background: #3b82f6; color: white; border: none; padding: 0.5rem 1.25rem; border-radius: 0.75rem; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
    .btn-primary:hover { background: #2563eb; }
    
    label.form-label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; font-weight: 500; }
  </style>
</head>
<body class="h-screen overflow-hidden flex">

  <!-- LEFT SIDEBAR -->
  <aside class="group w-[80px] hover:w-[260px] transition-all duration-300 bg-[#0e1628] border-r border-[#1e293b] flex flex-col shrink-0 z-50 h-full overflow-hidden">
    <div class="h-24 flex items-center px-6 overflow-hidden">
      <div class="flex items-center">
        <i class="ph-fill ph-heartbeat text-4xl text-blue-500 shrink-0"></i>
        <div class="flex flex-col">
          <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 text-white font-bold text-xl leading-tight">Clínica Vida</span><span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 text-[0.65rem] text-slate-400 font-semibold tracking-widest">GESTÃO DE SAÚDE</span>
        </div>
      </div>
    </div>
    
    <nav class="flex flex-col gap-2 mt-4 flex-1">
      <a href="dashboard.html" class="sidebar-item"><i class="ph ph-house text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Início</span></a>
      <a href="pacientes.html" class="sidebar-item active"><i class="ph ph-users text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Pacientes</span></a>
      <a href="medicos.html" class="sidebar-item"><i class="ph ph-user-circle-plus text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Médicos</span></a>
      <a href="consultas.html" class="sidebar-item"><i class="ph ph-calendar-plus text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Consultas</span></a>
      
      <a href="relatorios.html" class="sidebar-item admin-only"><i class="ph ph-chart-bar text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Relatórios</span></a>
      <a href="admin-users.html" class="sidebar-item admin-only"><i class="ph ph-shield text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Admin</span></a>
    </nav>
    
    <div class="p-6">
      <button onclick="logout()" class="sidebar-item !mx-0 !px-0 flex items-center gap-3 w-full text-left">
        <i class="ph ph-sign-out text-2xl text-slate-400 shrink-0"></i>
        <div class="flex flex-col">
          <span class="text-white font-medium text-sm opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Sair</span>
          <span class="text-xs text-slate-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Encerrar sessão</span>
        </div>
      </button>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <div class="flex-1 flex flex-col overflow-hidden bg-[#0b1221]">
    
    <!-- TOP HEADER -->
    <header class="h-20 px-8 flex items-center justify-between shrink-0">
      <div class="relative">
        <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 shrink-0"></i>
        <input type="text" placeholder="Buscar..." class="w-[300px] bg-[#131c31] border border-[#1e293b] rounded-full py-2 pl-12 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
      </div>
      
      <div class="flex items-center gap-6">
        <button class="relative text-slate-400 hover:text-white transition">
          <i class="ph ph-bell text-2xl shrink-0"></i>
        </button>
        <div class="flex items-center gap-3 border-l border-[#1e293b] pl-6 cursor-pointer">
          <div class="w-10 h-10 rounded-full bg-cyan-400 text-slate-900 flex items-center justify-center font-bold text-lg" id="avatar-initial">U</div>
        </div>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="flex-1 overflow-y-auto p-8 pt-2 flex flex-col gap-6 relative">
      <div class="flex justify-between items-center shrink-0">
        <div>
          <h1 class="text-3xl font-bold text-white tracking-tight">Pacientes</h1>
          <p class="text-sm text-slate-400 mt-1">Gerencie o cadastro e histórico dos pacientes.</p>
        </div>
        <div>
          <button class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 transition-colors" onclick="openModalPaciente()">
            <i class="ph ph-plus text-lg"></i> Novo Paciente
          </button>
        </div>
      </div>
      
      <div class="dark-card flex-1 flex flex-col overflow-hidden">
        <div class="overflow-y-auto flex-1">
          

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Data de Nasc.</th>
                                <th>Telefone</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="pacientes-table-body">
                            <tr><td colspan="4" style="text-align: center;">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination-container" id="pagination-pacientes"></div>
            
        </div>
      </div>
    
      <!-- Modal Paciente -->
      <div id="modal-paciente" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="bg-[#131c31] border border-[#1e293b] rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl">
          <div class="px-6 py-4 border-b border-[#1e293b] flex justify-between items-center">
            <h2 class="text-xl font-bold text-white" id="modal-paciente-title">Novo Paciente</h2>
            <button onclick="closeModalPaciente()" class="text-slate-400 hover:text-white transition-colors"><i class="ph ph-x text-xl"></i></button>
          </div>
          <div class="p-6">
            <form id="form-paciente" class="grid grid-cols-2 gap-4">
              <input type="hidden" id="paciente-id">
              <div class="col-span-2">
                <label class="block text-xs font-semibold text-slate-400 mb-1">Nome Completo</label>
                <input type="text" id="paciente-nome" required class="w-full bg-[#0b1221] border border-[#1e293b] rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
              </div>
              <div class="col-span-1">
                <label class="block text-xs font-semibold text-slate-400 mb-1">E-mail</label>
                <input type="email" id="paciente-email" required class="w-full bg-[#0b1221] border border-[#1e293b] rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
              </div>
              <div class="col-span-1" id="div-senha">
                <label class="block text-xs font-semibold text-slate-400 mb-1">Senha de Acesso</label>
                <input type="password" id="paciente-senha" class="w-full bg-[#0b1221] border border-[#1e293b] rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
              </div>
              <div class="col-span-1">
                <label class="block text-xs font-semibold text-slate-400 mb-1">CPF</label>
                <input type="text" id="paciente-cpf" required class="w-full bg-[#0b1221] border border-[#1e293b] rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
              </div>
              <div class="col-span-1">
                <label class="block text-xs font-semibold text-slate-400 mb-1">Telefone</label>
                <input type="text" id="paciente-telefone" class="w-full bg-[#0b1221] border border-[#1e293b] rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
              </div>
              <div class="col-span-1">
                <label class="block text-xs font-semibold text-slate-400 mb-1">Data de Nascimento</label>
                <input type="date" id="paciente-nascimento" class="w-full bg-[#0b1221] border border-[#1e293b] rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
              </div>
              <div class="col-span-1">
                <label class="block text-xs font-semibold text-slate-400 mb-1">Gênero</label>
                <select id="paciente-genero" class="w-full bg-[#0b1221] border border-[#1e293b] rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                  <option value="">Selecione</option>
                  <option value="M">Masculino</option>
                  <option value="F">Feminino</option>
                  <option value="O">Outro</option>
                </select>
              </div>
              <div class="col-span-2">
                <label class="block text-xs font-semibold text-slate-400 mb-1">Endereço</label>
                <input type="text" id="paciente-endereco" class="w-full bg-[#0b1221] border border-[#1e293b] rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
              </div>
            </form>
          </div>
          <div class="px-6 py-4 bg-[#0b1221] border-t border-[#1e293b] flex justify-end gap-3">
            <button onclick="closeModalPaciente()" class="px-4 py-2 rounded-lg font-bold text-sm text-slate-300 hover:text-white transition-colors">Cancelar</button>
            <button onclick="salvarPaciente()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-bold text-sm transition-colors">Salvar Paciente</button>
          </div>
        </div>
      </div>

    </main>
  </div>
  
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    
        
        
        const limit = 10;
        let currentPage = 1;

        
        function openModalPaciente(isEdit = false, rawData = null) {
            const modal = document.getElementById('modal-paciente');
            const title = document.getElementById('modal-paciente-title');
            const divSenha = document.getElementById('div-senha');
            const inputSenha = document.getElementById('paciente-senha');
            
            document.getElementById('form-paciente').reset();
            document.getElementById('paciente-id').value = '';
            
            if(isEdit && rawData) {
                const p = JSON.parse(rawData);
                title.innerText = 'Editar Paciente';
                divSenha.classList.add('hidden'); // Hide password on edit for now
                inputSenha.removeAttribute('required');
                
                document.getElementById('paciente-id').value = p.id;
                document.getElementById('paciente-nome').value = p.user.nome || '';
                document.getElementById('paciente-email').value = p.user.email || '';
                document.getElementById('paciente-cpf').value = p.cpf || '';
                document.getElementById('paciente-telefone').value = p.telefone || '';
                document.getElementById('paciente-nascimento').value = p.data_nascimento || '';
                document.getElementById('paciente-genero').value = p.genero || '';
                document.getElementById('paciente-endereco').value = p.endereco || '';
            } else {
                title.innerText = 'Novo Paciente';
                divSenha.classList.remove('hidden');
                inputSenha.setAttribute('required', 'required');
            }
            
            modal.classList.remove('hidden');
        }

        function closeModalPaciente() {
            document.getElementById('modal-paciente').classList.add('hidden');
        }

        async function salvarPaciente() {
            const form = document.getElementById('form-paciente');
            if(!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            
            const id = document.getElementById('paciente-id').value;
            const isEdit = !!id;
            
            const payload = {
                nome: document.getElementById('paciente-nome').value,
                email: document.getElementById('paciente-email').value,
                cpf: document.getElementById('paciente-cpf').value,
                telefone: document.getElementById('paciente-telefone').value,
                data_nascimento: document.getElementById('paciente-nascimento').value || null,
                genero: document.getElementById('paciente-genero').value || null,
                endereco: document.getElementById('paciente-endereco').value || null
            };
            
            try {
                if(isEdit) {
                    await window.api.updatePaciente(id, payload);
                    window.showToast('Paciente atualizado com sucesso!');
                } else {
                    payload.password = document.getElementById('paciente-senha').value;
                    await window.api.createPaciente(payload);
                    window.showToast('Paciente cadastrado com sucesso!');
                }
                closeModalPaciente();
                carregarPacientes(currentPage);
            } catch(e) {
                alert('Erro: ' + e.message);
            }
        }

        async function carregarPacientes(pagina = 1) {
            const token = localStorage.getItem('token');
            if (!token) return;

            currentPage = pagina;
            const skip = (pagina - 1) * limit;

            try {
                const response = await window.api.getPacientes(skip, limit);
                const pacientes = response.items;
                const total = response.total;

                const tbody = document.getElementById('pacientes-table-body');
                tbody.innerHTML = '';
                
                if (pacientes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Nenhum paciente cadastrado.</td></tr>';
                } else {
                    pacientes.forEach(p => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>
                                <div style="display: flex; align-items: center; gap: 0.75rem;">
                                    <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--primary-light); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold;">
                                        ${p.user.nome.charAt(0).toUpperCase()}
                                    </div>
                                    <span style="font-weight: 500; color: white;">${p.user.nome}</span>
                                </div>
                            </td>
                            <td>${p.cpf}</td>
                            <td>${p.data_nascimento.split('-').reverse().join('/')}</td>
                            <td>${p.telefone || '-'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
                
                window.renderPagination('pagination-pacientes', total, limit, currentPage, carregarPacientes);
            } catch (error) {
                console.error(error);
                showToast('Erro ao carregar pacientes', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarPacientes();
        });

        // Modal Logic
        const modal = document.getElementById('pacienteModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtns = document.querySelectorAll('.modal-close, .modal-close-btn');

        openBtn.addEventListener('click', () => modal.classList.add('active'));
        
        closeBtns.forEach(btn => btn.addEventListener('click', () => {
            modal.classList.remove('active');
            document.getElementById('formPaciente').reset();
        }));

        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        document.getElementById('formPaciente').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                // 1. Criar o usuário base
                const userData = {
                    nome: document.getElementById('p_nome').value,
                    email: document.getElementById('p_email').value,
                    senha: document.getElementById('p_senha').value,
                    role: 'PACIENTE',
                    ativo: true
                };
                const userResp = await window.api.register(userData);

                // 2. Criar o paciente vinculado ao ID retornado
                const pacData = {
                    usuario_id: userResp.id,
                    cpf: document.getElementById('p_cpf').value,
                    data_nascimento: document.getElementById('p_data_nascimento').value,
                    telefone: document.getElementById('p_telefone').value
                };
                await window.api.createPaciente(pacData);
                showToast('Paciente criado com sucesso!', 'success');
                modal.classList.remove('active');
                e.target.reset();
                // Reload page or list
                setTimeout(() => window.location.reload(), 1000);
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    
  </script>
</body>
