<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultas - ClinicFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="css/style.css?v=2">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #171728; color: #94a3b8; }
    .sidebar-bg { background-color: #1a1a2e; border-right: 1px solid rgba(255,255,255,0.03); }
    .panel-bg { background-color: #1e1e32; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    .table th { color: #94a3b8 !important; border-bottom: 1px solid rgba(255,255,255,0.05) !important; padding: 1.25rem 1rem !important; text-transform: uppercase; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-align: left;}
    .table td { color: white !important; border-bottom: 1px solid rgba(255,255,255,0.03) !important; padding: 1.25rem 1rem !important; font-size: 0.85rem; font-weight: 500;}
    .table tbody tr:hover { background-color: rgba(255,255,255,0.02) !important; }
    
    .form-control { background: #171728 !important; border: 1px solid rgba(255,255,255,0.05) !important; color: white !important; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.85rem;}
    .form-control:focus { border-color: #4f46e5 !important; outline: none; }
    
    .btn-primary { background: #4f46e5 !important; color: white !important; border: none !important; padding: 0.6rem 1.2rem; border-radius: 99px; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.5rem;}
    .btn-primary:hover { background: #4338ca !important; }
    .btn-secondary { background: #171728 !important; color: white !important; border: 1px solid rgba(255,255,255,0.1) !important; padding: 0.6rem 1.2rem; border-radius: 99px; font-weight: 600; font-size: 0.85rem;}
    .btn-secondary:hover { background: rgba(255,255,255,0.05) !important; }
    
    .modal-container { background: #1e1e32 !important; color: #e2e8f0 !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 16px;}
    .modal-header { border-bottom: 1px solid rgba(255,255,255,0.05) !important; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center;}
    .modal-footer { border-top: 1px solid rgba(255,255,255,0.05) !important; background: transparent !important; padding: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem;}
    
    .content-panel { background: #1e1e32 !important; border-radius: 1rem !important; padding: 1rem !important; }
    
    .badge-success { background: #d1fae5; color: #065f46; font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 99px; font-weight: 600;}
    .badge-error { background: #fee2e2; color: #991b1b; font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 99px; font-weight: 600;}
  </style>

</head>
<body class="h-screen overflow-hidden flex">

      <aside class="group w-[80px] hover:w-[240px] sidebar-bg flex flex-col justify-between shrink-0 z-50 h-full overflow-hidden transition-all duration-300 absolute md:relative">
    <div class="flex flex-col w-[240px]">
      <div class="h-24 flex items-center px-6 mt-2">
        <div class="w-10 h-10 shrink-0 rounded-full bg-[#4f46e5] flex items-center justify-center font-bold text-white text-xl">
          C
        </div>
      </div>
      <nav class="flex flex-col gap-2 mt-4">
        <a href="dashboard.html" class="py-3 rounded-lg flex items-center gap-4 font-medium transition-all duration-300 mx-3 px-3 text-slate-400 hover:text-white">
          <i class="ph ph-house text-xl shrink-0"></i> 
          <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Início</span>
        </a>
        <a href="pacientes.html" class="py-3 rounded-lg flex items-center gap-4 font-medium transition-all duration-300 mx-3 px-3 text-slate-400 hover:text-white">
          <i class="ph ph-user text-xl shrink-0"></i> 
          <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Pacientes</span>
        </a>
        <a href="medicos.html" class="py-3 rounded-lg flex items-center gap-4 font-medium transition-all duration-300 mx-3 px-3 text-slate-400 hover:text-white admin-only">
          <i class="ph ph-stethoscope text-xl shrink-0"></i> 
          <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Médicos</span>
        </a>
        <a href="consultas.html" class="py-3 rounded-lg flex items-center gap-4 font-medium transition-all duration-300 mx-3 px-3 bg-[#4f46e5] text-white">
          <i class="ph ph-calendar-blank text-xl shrink-0"></i> 
          <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Consultas</span>
        </a>
        <a href="admin-users.html" class="py-3 rounded-lg flex items-center gap-4 font-medium transition-all duration-300 mx-3 px-3 text-slate-400 hover:text-white admin-only">
          <i class="ph ph-shield text-xl shrink-0"></i> 
          <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Admin</span>
        </a>
      </nav>
    </div>
    <div class="p-4 mb-4 w-[240px]">
      <button class="w-[calc(100%-1.5rem)] px-3 py-3 rounded-lg text-slate-400 hover:text-white flex items-center gap-4 font-medium transition mx-3" onclick="logout()">
        <i class="ph ph-sign-out text-xl shrink-0"></i> 
        <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Sair</span>
      </button>
    </div>
  </aside>

  <main class="flex-1 flex flex-col p-8 overflow-y-auto gap-4 relative">
        <header class="flex justify-between items-center mb-8 px-2 mt-4">
      <div>
        <h1 class="text-3xl font-bold text-white tracking-tight">Consultas</h1>
        <p class="text-sm text-slate-400 mt-2">Agendamentos e histórico de atendimentos.</p>
      </div>
      <div class="flex items-center gap-4">
        
        <button class="w-10 h-10 rounded-full bg-[#1e1e32] border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition">
          <i class="ph ph-bell text-lg"></i>
        </button>
      </div>
    </header>
    
    <div class="content-panel flex-1 overflow-y-auto">

                <div class="filters-bar" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; background: #1e1e2d; padding: 1rem; border-radius: 8px; border: 1px solid #3f425c;">
                    <input type="date" id="filter-data" class="form-control" style="flex: 1; min-width: 140px;">
                    <input type="text" id="filter-paciente" class="form-control" placeholder="Buscar Paciente..." style="flex: 1; min-width: 160px;">
                    <input type="text" id="filter-medico" class="form-control" placeholder="Buscar Médico..." style="flex: 1; min-width: 160px;">
                    <select id="filter-especialidade" class="form-control" style="flex: 1; min-width: 160px;">
                        <option value="">Especialidade...</option>
                        <option value="Cardiologia">Cardiologia</option>
                        <option value="Dermatologia">Dermatologia</option>
                        <option value="Ortopedia">Ortopedia</option>
                        <option value="Pediatria">Pediatria</option>
                        <option value="Ginecologia">Ginecologia</option>
                        <option value="Neurologia">Neurologia</option>
                    </select>
                    <select id="filter-status" class="form-control" style="flex: 1; min-width: 140px;">
                        <option value="">Todos os Status</option>
                        <option value="agendada">Agendada</option>
                        <option value="realizada">Realizada</option>
                        <option value="nao realizada">Não Realizada</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                    <button class="btn btn-primary" id="btn-filtrar" style="flex: 0 0 auto;">Filtrar</button>
                    <button class="btn btn-secondary" id="btn-limpar" style="flex: 0 0 auto; background: transparent; color: #cbd5e1; border: 1px solid var(--border-color);">Limpar</button>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Data e Hora</th>
                                <th>Paciente</th>
                                <th>Médico</th>
                                <th>Especialidade</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="consultas-table-body">
                            <tr><td colspan="5" style="text-align: center;">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination-container" id="pagination-consultas"></div>
            </div>
        </main>

    <!-- Modal Nova Consulta -->
    <div class="modal-overlay" id="consultaModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Agendar Consulta</h3>
                <button class="modal-close"><i data-lucide="x"></i></button>
            </div>
            <form id="formConsulta">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Paciente</label>
                        <input type="text" id="c_paciente_input" list="lista-pacientes" class="form-control" required placeholder="Digite o nome ou CPF...">
                        <datalist id="lista-pacientes"></datalist>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Médico</label>
                        <input type="text" id="c_medico_input" list="lista-medicos" class="form-control" required placeholder="Digite o nome ou CRM...">
                        <datalist id="lista-medicos"></datalist>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Data</label>
                        <input type="date" id="c_data" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Horário</label>
                        <input type="time" id="c_horario" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Observação</label>
                        <input type="text" id="c_observacao" class="form-control" placeholder="Alguma observação extra?">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-close-btn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Agendar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        lucide.createIcons();

        // Control UI visibility based on RBAC role
        const tokenInfo = localStorage.getItem('token');
        let userRole = null;
        if (tokenInfo) {
            try {
                const payload = JSON.parse(atob(tokenInfo.split('.')[1]));
                userRole = payload.role;
                if (payload.role === 'medico') {
                    document.getElementById('filter-medico').style.display = 'none';
                    // Seletor de especialidade também é inútil para o médico (só vê as dele)
                    document.getElementById('filter-especialidade').style.display = 'none';
                } else if (payload.role === 'paciente') {
                    document.getElementById('filter-paciente').style.display = 'none';
                    document.getElementById('openModalBtn').style.display = 'none'; // Pacientes geralmente não agendam sozinhos aqui, ou se agendarem, esconde o seu input
                }
            } catch(e) {}
        }

        const limit = 10;
        let currentPage = 1;

        async function carregarConsultas(pagina = 1) {
            const token = localStorage.getItem('token');
            if (!token) return;

            currentPage = pagina;
            const skip = (pagina - 1) * limit;

            const filters = {};
            const dataVal = document.getElementById('filter-data').value;
            if (dataVal) filters.data = dataVal;
            
            const pacVal = document.getElementById('filter-paciente').value;
            if (pacVal) filters.paciente = pacVal;
            
            const medVal = document.getElementById('filter-medico').value;
            if (medVal) filters.medico = medVal;
            
            const espVal = document.getElementById('filter-especialidade').value;
            if (espVal) filters.especialidade = espVal;
            
            const statusVal = document.getElementById('filter-status').value;
            if (statusVal) filters.status = statusVal;

            try {
                const response = await window.api.getConsultas(skip, limit, filters);
                const consultas = response.items;
                const total = response.total;

                const tbody = document.getElementById('consultas-table-body');
                tbody.innerHTML = '';
                
                if (consultas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Nenhuma consulta encontrada.</td></tr>';
                } else {
                    const statusColorMap = {
                        "agendada": "status-agendada",
                        "realizada": "status-realizada",
                        "cancelada": "status-cancelada",
                        "nao realizada": "status-nao-realizada"
                    };

                    consultas.forEach(c => {
                        const tr = document.createElement('tr');
                        const cssClass = statusColorMap[c.status] || 'badge-warning';
                        
                        let statusHtml = `<span class="badge ${cssClass}">${c.status}</span>`;
                        // Apenas admin, receptionist, e medico podem ver o select.
                        // O backend já garante que o médico só veja as dele, então não precisamos ocultar baseado no medico_id aqui.
                        if (userRole === 'admin' || userRole === 'receptionist' || userRole === 'medico') {
                            statusHtml = `
                                <select class="form-control" onchange="atualizarStatus(${c.id}, this.value)" style="padding: 2px 8px; font-size: 0.85rem; display: inline-block; width: auto; background-color: var(--bg-color);">
                                    <option value="agendada" ${c.status === 'agendada' ? 'selected' : ''}>Agendada</option>
                                    <option value="realizada" ${c.status === 'realizada' ? 'selected' : ''}>Realizada</option>
                                    <option value="nao realizada" ${c.status === 'nao realizada' ? 'selected' : ''}>Não Realizada</option>
                                    <option value="cancelada" ${c.status === 'cancelada' ? 'selected' : ''}>Cancelada</option>
                                </select>
                            `;
                        }

                        tr.innerHTML = `
                            <td>
                                <div style="font-weight: 500; color: white;">${c.data.split('-').reverse().join('/')}</div>
                                <div style="font-size: 0.75rem; color: #cbd5e1;">${c.horario.substring(0,5)}</div>
                            </td>
                            <td>${c.paciente.user.nome}</td>
                            <td>${c.medico.user.nome}</td>
                            <td>${c.medico.especialidade}</td>
                            <td>${statusHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
                window.renderPagination('pagination-consultas', total, limit, currentPage, carregarConsultas);
            } catch (error) {
                console.error(error);
                showToast('Erro ao carregar consultas', 'error');
            }
        }

        async function atualizarStatus(consultaId, novoStatus) {
            try {
                await window.api.updateConsultaStatus(consultaId, novoStatus);
                showToast('Status atualizado com sucesso!', 'success');
                carregarConsultas(currentPage); // Atualiza a tabela na mesma página
            } catch (error) {
                showToast(error.message, 'error');
                carregarConsultas(currentPage); // Reverte caso haja erro
            }
        }

        let mapPacientes = {};
        let mapMedicos = {};

        async function carregarOpcoesSelects() {
            try {
                const pacResponse = await window.api.getPacientes(0, 1000);
                const listPacientes = document.getElementById('lista-pacientes');
                if (pacResponse && pacResponse.items) {
                    pacResponse.items.forEach(p => {
                        const text = `${p.usuario.nome} - CPF: ${p.cpf}`;
                        mapPacientes[text] = p.id;
                        const opt = document.createElement('option');
                        opt.value = text;
                        listPacientes.appendChild(opt);
                    });
                }

                const medResponse = await window.api.getMedicos(0, 1000);
                const listMedicos = document.getElementById('lista-medicos');
                if (medResponse && medResponse.items) {
                    medResponse.items.forEach(m => {
                        const text = `${m.usuario.nome} - ${m.especialidade.nome}`;
                        mapMedicos[text] = m.id;
                        const opt = document.createElement('option');
                        opt.value = text;
                        listMedicos.appendChild(opt);
                    });
                }
            } catch (error) {
                console.error("Erro ao carregar opções do modal:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarConsultas();
            carregarOpcoesSelects();

            document.getElementById('btn-filtrar').addEventListener('click', () => {
                carregarConsultas(1);
            });
            
            document.getElementById('btn-limpar').addEventListener('click', () => {
                document.getElementById('filter-data').value = '';
                document.getElementById('filter-paciente').value = '';
                document.getElementById('filter-medico').value = '';
                document.getElementById('filter-especialidade').value = '';
                document.getElementById('filter-status').value = '';
                carregarConsultas(1);
            });
        });

        // Modal Logic
        const modal = document.getElementById('consultaModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtns = document.querySelectorAll('.modal-close, .modal-close-btn');

        if (openBtn) {
            openBtn.addEventListener('click', () => modal.classList.add('active'));
        }
        
        closeBtns.forEach(btn => btn.addEventListener('click', () => {
            modal.classList.remove('active');
            document.getElementById('formConsulta').reset();
        }));

        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        document.getElementById('formConsulta').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const pacText = document.getElementById('c_paciente_input').value;
            const medText = document.getElementById('c_medico_input').value;
            
            const paciente_id = mapPacientes[pacText];
            const medico_id = mapMedicos[medText];
            
            if (!paciente_id) return showToast('Paciente não encontrado na lista', 'error');
            if (!medico_id) return showToast('Médico não encontrado na lista', 'error');

            const data = {
                paciente_id: paciente_id,
                medico_id: medico_id,
                data: document.getElementById('c_data').value,
                horario: document.getElementById('c_horario').value,
                observacao: document.getElementById('c_observacao').value
            };

            try {
                await window.api.createConsulta(data);
                showToast('Consulta agendada com sucesso!', 'success');
                modal.classList.remove('active');
                e.target.reset();
                setTimeout(() => window.location.reload(), 1000);
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    </script>
</body>
</html>
