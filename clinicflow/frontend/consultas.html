<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultas - ClinicFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #000f24; color: #94a3b8; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    .sidebar-item { padding: 0.75rem 1rem; border-radius: 0.75rem; display: flex; align-items: center; gap: 1rem; font-weight: 500; transition: 0.3s; color: #cbd5e1; margin: 0 1rem; }
    .sidebar-item:hover { background: rgba(255,255,255,0.05); color: white; }
    .sidebar-item.active { background: linear-gradient(90deg, #3b82f6, #2563eb); color: white; font-weight: 600; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    
    .dark-card { background: #001b3a; border-radius: 1rem; border: 1px solid #002d5c; padding: 1.5rem; }
    
    .table { width: 100%; border-collapse: collapse; }
    .table th { color: #94a3b8; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; padding: 1rem; text-align: left; border-bottom: 1px solid #002d5c; }
    .table td { padding: 1.25rem 1rem; font-size: 0.85rem; color: #cbd5e1; border-bottom: 1px solid #002d5c; }
    .table tr:hover td { background: rgba(255,255,255,0.02); }
    
    @keyframes highlightGlow {
      0%, 100% {
        background-color: rgba(30, 58, 138, 0.45);
        box-shadow: inset 4px 0 0 0 #3b82f6, 0 0 20px rgba(59, 130, 246, 0.25);
      }
      50% {
        background-color: rgba(30, 58, 138, 0.75);
        box-shadow: inset 4px 0 0 0 #60a5fa, 0 0 30px rgba(96, 165, 250, 0.5);
      }
    }
    .row-highlight {
      animation: highlightGlow 2.5s ease-in-out infinite;
    }
    .row-highlight td {
      background-color: transparent !important;
      color: #ffffff !important;
      border-bottom: 1px solid #1d4ed8 !important;
    }
    
    .badge-success { background: rgba(16,185,129,0.15); color: #34d399; font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 99px; font-weight: 600; }
    .badge-error { background: rgba(244,63,94,0.15); color: #fb7185; font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 99px; font-weight: 600; }
    
    .form-control { background: #000f24; border: 1px solid #002d5c; color: white; padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.85rem; width: 100%; transition: 0.2s; }
    .form-control:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    
    .modal-container { background: #001b3a; color: #e2e8f0; border: 1px solid #002d5c; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .modal-header { border-bottom: 1px solid #002d5c; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .modal-footer { border-top: 1px solid #002d5c; padding: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem; }
    
    .btn-secondary { background: transparent; color: #94a3b8; border: 1px solid #334155; padding: 0.5rem 1rem; border-radius: 0.75rem; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
    .btn-secondary:hover { background: #002d5c; color: white; }
    .btn-primary { background: #3b82f6; color: white; border: none; padding: 0.5rem 1.25rem; border-radius: 0.75rem; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
    .btn-primary:hover { background: #2563eb; }
    
    label.form-label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; font-weight: 500; }
  </style>
</head>
<body class="h-screen overflow-hidden flex">

  <!-- LEFT SIDEBAR -->
  <aside class="group w-[80px] hover:w-[260px] transition-all duration-300 bg-[#000f24] border-r border-[#002d5c] flex flex-col shrink-0 z-50 h-full overflow-hidden">
    <div class="h-24 flex items-center px-6 overflow-hidden">
      <div class="flex items-center">
        <i class="ph-fill ph-heartbeat text-4xl text-blue-500 shrink-0"></i>
        <div class="flex flex-col">
          <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 text-white font-bold text-xl leading-tight">ClinicFlow</span><span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 text-[0.65rem] text-slate-400 font-semibold tracking-widest">GESTÃO DE SAÚDE</span>
        </div>
      </div>
    </div>
    
    <nav class="flex flex-col gap-2 mt-4 flex-1">
      <a href="dashboard.html" class="sidebar-item"><i class="ph ph-house text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Início</span></a>
      <a href="pacientes.html" class="sidebar-item"><i class="ph ph-users text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Pacientes</span></a>
      <a href="medicos.html" class="sidebar-item"><i class="ph ph-user-circle-plus text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Médicos</span></a>
      <a href="consultas.html" class="sidebar-item active"><i class="ph ph-calendar-plus text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Consultas</span></a>
      
      <a href="relatorios.html" class="sidebar-item admin-only"><i class="ph ph-chart-bar text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Relatórios</span></a>
      <a href="admin-users.html" class="sidebar-item admin-only"><i class="ph ph-shield text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Admin</span></a>
    </nav>
    
    <div class="p-6">
      <button onclick="logout()" class="sidebar-item !mx-0 !px-0 flex items-center gap-3 w-full text-left">
        <i class="ph ph-sign-out text-2xl text-slate-400 shrink-0"></i>
        <div class="flex flex-col">
          <span class="text-white font-medium text-sm opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Sair</span>
          <span class="text-xs text-slate-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Encerrar sessão</span>
        </div>
      </button>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <div class="flex-1 flex flex-col overflow-hidden bg-[#000f24]">
    
    <!-- TOP HEADER -->
    <header class="h-20 px-8 flex items-center justify-end shrink-0">
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-3 border-l border-[#002d5c] pl-6 cursor-pointer">
          <div class="w-10 h-10 rounded-full bg-cyan-400 text-slate-900 flex items-center justify-center font-bold text-lg" id="avatar-initial">U</div>
        </div>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="flex-1 overflow-y-auto p-8 pt-2 flex flex-col gap-6 relative">
      <div class="flex justify-between items-center shrink-0">
        <div>
          <h1 class="text-3xl font-bold text-white tracking-tight">Consultas</h1>
          <p class="text-sm text-slate-400 mt-1">Agendamentos e histórico de atendimentos.</p>
        </div>
        <div>
          
        </div>
      </div>
      
      <div class="dark-card flex-1 flex flex-col overflow-hidden">
        <div class="overflow-y-auto flex-1">
          

                <div class="filters-bar flex flex-wrap items-center gap-4 mb-6 border-b border-[#002d5c] pb-6">
                    <input type="date" id="filter-data" class="form-control [color-scheme:dark]" style="flex: 1; min-width: 140px;" onclick="if('showPicker' in this) this.showPicker()">
                    <input type="text" id="filter-paciente" class="form-control" placeholder="Buscar Paciente..." style="flex: 1; min-width: 160px;">
                    <input type="text" id="filter-medico" class="form-control" placeholder="Buscar Médico..." style="flex: 1; min-width: 160px;">
                    <select id="filter-especialidade" class="form-control" style="flex: 1; min-width: 160px;">
                        <option value="">Especialidade...</option>
                        <option value="Cardiologia">Cardiologia</option>
                        <option value="Dermatologia">Dermatologia</option>
                        <option value="Ortopedia">Ortopedia</option>
                        <option value="Pediatria">Pediatria</option>
                        <option value="Ginecologia">Ginecologia</option>
                        <option value="Neurologia">Neurologia</option>
                    </select>
                    <select id="filter-status" class="form-control" style="flex: 1; min-width: 140px;">
                        <option value="">Todos os Status</option>
                        <option value="agendada">Agendada</option>
                        <option value="realizada">Realizada</option>
                        <option value="nao realizada">Não Realizada</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                    <div style="display: flex; gap: 0.75rem; flex: 0 0 auto;">
                        <button class="btn btn-secondary" id="btn-limpar" style="background: transparent; color: #cbd5e1; border: 1px solid #002d5c;">Limpar</button>
                        <button class="btn btn-primary" id="btn-filtrar">Filtrar</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Data e Hora</th>
                                <th>Paciente</th>
                                <th>Médico</th>
                                <th>Especialidade</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="consultas-table-body">
                            <tr><td colspan="5" style="text-align: center;">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination-container" id="pagination-consultas"></div>
            
        </div>
      </div>
    </main>
  </div>
  
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    
        

        // Control UI visibility based on RBAC role
        const tokenInfo = localStorage.getItem('token');
        let userRole = null;
        if (tokenInfo) {
            try {
                const payload = JSON.parse(atob(tokenInfo.split('.')[1]));
                userRole = payload.role;
                if (payload.role === 'medico') {
                    document.getElementById('filter-medico').style.display = 'none';
                    // Seletor de especialidade também é inútil para o médico (só vê as dele)
                    document.getElementById('filter-especialidade').style.display = 'none';
                } else if (payload.role === 'paciente') {
                    document.getElementById('filter-paciente').style.display = 'none';
                    document.getElementById('openModalBtn').style.display = 'none'; // Pacientes geralmente não agendam sozinhos aqui, ou se agendarem, esconde o seu input
                }
            } catch(e) {}
        }

        const urlParams = new URLSearchParams(window.location.search);
        let highlightId = urlParams.get('highlight_id') || urlParams.get('id');
        const dataParam = urlParams.get('data');

        const limit = 10;
        let currentPage = 1;

        async function carregarConsultas(pagina = 1) {
            const token = localStorage.getItem('token');
            if (!token) return;

            currentPage = pagina;
            const skip = (pagina - 1) * limit;

            const filters = {};
            const dataVal = document.getElementById('filter-data').value;
            if (dataVal) filters.data = dataVal;
            
            const pacVal = document.getElementById('filter-paciente').value;
            if (pacVal) filters.paciente = pacVal;
            
            const medVal = document.getElementById('filter-medico').value;
            if (medVal) filters.medico = medVal;
            
            const espVal = document.getElementById('filter-especialidade').value;
            if (espVal) filters.especialidade = espVal;
            
            const statusVal = document.getElementById('filter-status').value;
            if (statusVal) filters.status = statusVal;

            try {
                const response = await window.api.getConsultas(skip, limit, filters);
                const consultas = response.items;
                window.currentConsultas = consultas;
                const total = response.total;

                const tbody = document.getElementById('consultas-table-body');
                tbody.innerHTML = '';
                
                if (consultas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Nenhuma consulta encontrada.</td></tr>';
                } else {
                    const statusColorMap = {
                        "agendada": "status-agendada",
                        "realizada": "status-realizada",
                        "cancelada": "status-cancelada",
                        "nao realizada": "status-nao-realizada"
                    };

                    consultas.forEach(c => {
                        const tr = document.createElement('tr');
                        
                        const isHighlight = highlightId && String(c.id) === String(highlightId);
                        if (isHighlight) {
                            tr.id = `consulta-row-${c.id}`;
                            tr.className = 'row-highlight transition-all duration-300';
                        }
                        
                        const now = new Date();
                        const year = now.getFullYear();
                        const month = String(now.getMonth() + 1).padStart(2, '0');
                        const day = String(now.getDate()).padStart(2, '0');
                        const hojeStr = `${year}-${month}-${day}`;
                        const agoraStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
                        const isFutura = c.data > hojeStr || (c.data === hojeStr && c.horario && c.horario > agoraStr);

                        // Atendimentos futuros nunca devem ser exibidos como realizada/realizado
                        let displayedStatus = c.status;
                        if (isFutura && (c.status === 'realizada' || c.status === 'realizado')) {
                            displayedStatus = 'agendada';
                        }

                        const cssClass = statusColorMap[displayedStatus] || 'badge-warning';
                        let statusHtml = `<span class="badge ${cssClass}">${displayedStatus}</span>`;
                        // Apenas admin, receptionist, e medico podem ver o select.
                        // O backend já garante que o médico só veja as dele, então não precisamos ocultar baseado no medico_id aqui.
                        if (userRole === 'admin' || userRole === 'receptionist' || userRole === 'medico') {
                            const textColors = {
                                "agendada": "text-blue-400",
                                "realizada": "text-emerald-400",
                                "nao realizada": "text-orange-400",
                                "cancelada": "text-rose-400"
                            };
                            const selectColor = textColors[displayedStatus] || "text-white";
                            
                            statusHtml = `
                                <div class="relative inline-block">
                                    <select class="outline-none border border-[#002d5c] rounded-full pl-3 pr-8 py-1 font-semibold text-xs cursor-pointer appearance-none transition-colors bg-[#001b3a] ${selectColor}" 
                                        onchange="atualizarStatus(${c.id}, this.value)">
                                        <option value="agendada" class="text-blue-400" ${displayedStatus === 'agendada' ? 'selected' : ''}>Agendada</option>
                                        <option value="realizada" class="text-emerald-400" ${displayedStatus === 'realizada' ? 'selected' : ''} ${isFutura ? 'disabled title="Atendimentos futuros não podem ser marcados como Realizada"' : ''}>Realizada${isFutura ? ' (Indisponível)' : ''}</option>
                                        <option value="nao realizada" class="text-orange-400" ${displayedStatus === 'nao realizada' ? 'selected' : ''}>Não Realizada</option>
                                        <option value="cancelada" class="text-rose-400" ${displayedStatus === 'cancelada' ? 'selected' : ''}>Cancelada</option>
                                    </select>
                                    <i class="ph ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none ${selectColor} opacity-70"></i>
                                </div>
                            `;
                        }

                        const highlightBadge = isHighlight 
                            ? `<span class="inline-flex items-center gap-1 text-[10px] font-bold text-blue-300 bg-blue-500/20 border border-blue-400/50 px-2 py-0.5 rounded-full animate-pulse"><i class="ph-fill ph-check-circle text-blue-400"></i> Em destaque</span>` 
                            : '';

                        tr.innerHTML = `
                            <td>
                                <div class="flex items-center flex-wrap gap-1.5">
                                    <span style="font-weight: 600; color: white;">${c.data.split('-').reverse().join('/')}</span>
                                    ${highlightBadge}
                                </div>
                                <div style="font-size: 0.75rem; color: #cbd5e1;">${c.horario ? c.horario.substring(0,5) : '--:--'}</div>
                            </td>
                            <td class="${isHighlight ? 'text-white font-bold' : ''}">${c.paciente.user.nome}</td>
                            <td>${c.medico.user.nome}</td>
                            <td>${c.medico.especialidade}</td>
                            <td>${statusHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    if (highlightId) {
                        setTimeout(() => {
                            const el = document.getElementById(`consulta-row-${highlightId}`);
                            if (el) {
                                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        }, 250);
                    }
                }
                window.renderPagination('pagination-consultas', total, limit, currentPage, carregarConsultas);
            } catch (error) {
                console.error(error);
                showToast('Erro ao carregar consultas', 'error');
            }
        }

        async function atualizarStatus(consultaId, novoStatus) {
            try {
                if (novoStatus === 'realizada' || novoStatus === 'realizado') {
                    const c = window.currentConsultas?.find(item => item.id === consultaId);
                    if (c) {
                        const now = new Date();
                        const year = now.getFullYear();
                        const month = String(now.getMonth() + 1).padStart(2, '0');
                        const day = String(now.getDate()).padStart(2, '0');
                        const hojeStr = `${year}-${month}-${day}`;
                        const agoraStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
                        if (c.data > hojeStr || (c.data === hojeStr && c.horario && c.horario > agoraStr)) {
                            showToast("Atendimentos futuros não podem ser marcados como 'Realizada'.", 'error');
                            carregarConsultas(currentPage);
                            return;
                        }
                    }
                }
                await window.api.updateConsultaStatus(consultaId, novoStatus);
                showToast('Status atualizado com sucesso!', 'success');
                carregarConsultas(currentPage); // Atualiza a tabela na mesma página
            } catch (error) {
                showToast(error.message, 'error');
                carregarConsultas(currentPage); // Reverte caso haja erro
            }
        }

        let mapPacientes = {};
        let mapMedicos = {};

        async function carregarOpcoesSelects() {
            try {
                const pacResponse = await window.api.getPacientes(0, 1000);
                const listPacientes = document.getElementById('lista-pacientes');
                if (pacResponse && pacResponse.items) {
                    pacResponse.items.forEach(p => {
                        const text = `${p.usuario.nome} - CPF: ${p.cpf}`;
                        mapPacientes[text] = p.id;
                        const opt = document.createElement('option');
                        opt.value = text;
                        listPacientes.appendChild(opt);
                    });
                }

                const medResponse = await window.api.getMedicos(0, 1000);
                const listMedicos = document.getElementById('lista-medicos');
                if (medResponse && medResponse.items) {
                    medResponse.items.forEach(m => {
                        const text = `${m.usuario.nome} - ${m.especialidade.nome}`;
                        mapMedicos[text] = m.id;
                        const opt = document.createElement('option');
                        opt.value = text;
                        listMedicos.appendChild(opt);
                    });
                }
            } catch (error) {
                console.error("Erro ao carregar opções do modal:", error);
            }
        }

        async function encontrarPaginaDoHighlight(hId) {
            try {
                const filters = {};
                const dataVal = document.getElementById('filter-data').value;
                if (dataVal) filters.data = dataVal;
                
                const response = await window.api.getConsultas(0, 1000, filters);
                if (response && response.items) {
                    const idx = response.items.findIndex(item => String(item.id) === String(hId));
                    if (idx !== -1) {
                        return Math.floor(idx / limit) + 1;
                    }
                }
            } catch (err) {
                console.error("Erro ao localizar página do destaque:", err);
            }
            return 1;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (dataParam) {
                document.getElementById('filter-data').value = dataParam;
            }
            carregarOpcoesSelects();

            let targetPage = 1;
            if (highlightId) {
                targetPage = await encontrarPaginaDoHighlight(highlightId);
            }
            carregarConsultas(targetPage);

            document.getElementById('btn-filtrar').addEventListener('click', () => {
                highlightId = null;
                carregarConsultas(1);
            });
            
            document.getElementById('btn-limpar').addEventListener('click', () => {
                document.getElementById('filter-data').value = '';
                document.getElementById('filter-paciente').value = '';
                document.getElementById('filter-medico').value = '';
                document.getElementById('filter-especialidade').value = '';
                document.getElementById('filter-status').value = '';
                highlightId = null;
                carregarConsultas(1);
            });
        });

        // Modal Logic
        const modal = document.getElementById('consultaModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtns = document.querySelectorAll('.modal-close, .modal-close-btn');

        if (openBtn) {
            openBtn.addEventListener('click', () => modal.classList.add('active'));
        }
        
        closeBtns.forEach(btn => btn.addEventListener('click', () => {
            modal.classList.remove('active');
            document.getElementById('formConsulta').reset();
        }));

        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        document.getElementById('formConsulta').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const pacText = document.getElementById('c_paciente_input').value;
            const medText = document.getElementById('c_medico_input').value;
            
            const paciente_id = mapPacientes[pacText];
            const medico_id = mapMedicos[medText];
            
            if (!paciente_id) return showToast('Paciente não encontrado na lista', 'error');
            if (!medico_id) return showToast('Médico não encontrado na lista', 'error');

            const data = {
                paciente_id: paciente_id,
                medico_id: medico_id,
                data: document.getElementById('c_data').value,
                horario: document.getElementById('c_horario').value,
                observacao: document.getElementById('c_observacao').value
            };

            try {
                await window.api.createConsulta(data);
                showToast('Consulta agendada com sucesso!', 'success');
                modal.classList.remove('active');
                e.target.reset();
                setTimeout(() => window.location.reload(), 1000);
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    
  </script>
</body>
</html>
