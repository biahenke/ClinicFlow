<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Utilizadores - ClinicFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="css/style.css?v=2">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #171728; color: #94a3b8; }
    .sidebar-bg { background-color: #1a1a2e; border-right: 1px solid rgba(255,255,255,0.03); }
    .panel-bg { background-color: #1e1e32; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    .table th { color: #94a3b8 !important; border-bottom: 1px solid rgba(255,255,255,0.05) !important; padding: 1.25rem 1rem !important; text-transform: uppercase; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-align: left;}
    .table td { color: white !important; border-bottom: 1px solid rgba(255,255,255,0.03) !important; padding: 1.25rem 1rem !important; font-size: 0.85rem; font-weight: 500;}
    .table tbody tr:hover { background-color: rgba(255,255,255,0.02) !important; }
    
    .form-control { background: #171728 !important; border: 1px solid rgba(255,255,255,0.05) !important; color: white !important; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.85rem;}
    .form-control:focus { border-color: #4f46e5 !important; outline: none; }
    
    .btn-primary { background: #4f46e5 !important; color: white !important; border: none !important; padding: 0.6rem 1.2rem; border-radius: 99px; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.5rem;}
    .btn-primary:hover { background: #4338ca !important; }
    .btn-secondary { background: #171728 !important; color: white !important; border: 1px solid rgba(255,255,255,0.1) !important; padding: 0.6rem 1.2rem; border-radius: 99px; font-weight: 600; font-size: 0.85rem;}
    .btn-secondary:hover { background: rgba(255,255,255,0.05) !important; }
    
    .modal-container { background: #1e1e32 !important; color: #e2e8f0 !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 16px;}
    .modal-header { border-bottom: 1px solid rgba(255,255,255,0.05) !important; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center;}
    .modal-footer { border-top: 1px solid rgba(255,255,255,0.05) !important; background: transparent !important; padding: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem;}
    
    .content-panel { background: #1e1e32 !important; border-radius: 1rem !important; padding: 1rem !important; }
    
    .badge-success { background: #d1fae5; color: #065f46; font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 99px; font-weight: 600;}
    .badge-error { background: #fee2e2; color: #991b1b; font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 99px; font-weight: 600;}
  </style>

</head>
<body class="h-screen overflow-hidden flex">

      <aside class="group w-[80px] hover:w-[240px] sidebar-bg flex flex-col justify-between shrink-0 z-50 h-full overflow-hidden transition-all duration-300 absolute md:relative">
    <div class="flex flex-col w-[240px]">
      <div class="h-24 flex items-center px-6 mt-2">
        <div class="w-10 h-10 shrink-0 rounded-full bg-[#4f46e5] flex items-center justify-center font-bold text-white text-xl">
          C
        </div>
      </div>
      <nav class="flex flex-col gap-2 mt-4">
        <a href="dashboard.html" class="py-3 rounded-lg flex items-center gap-4 font-medium transition-all duration-300 mx-3 px-3 text-slate-400 hover:text-white">
          <i class="ph ph-house text-xl shrink-0"></i> 
          <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Início</span>
        </a>
        <a href="pacientes.html" class="py-3 rounded-lg flex items-center gap-4 font-medium transition-all duration-300 mx-3 px-3 text-slate-400 hover:text-white">
          <i class="ph ph-user text-xl shrink-0"></i> 
          <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Pacientes</span>
        </a>
        <a href="medicos.html" class="py-3 rounded-lg flex items-center gap-4 font-medium transition-all duration-300 mx-3 px-3 text-slate-400 hover:text-white admin-only">
          <i class="ph ph-stethoscope text-xl shrink-0"></i> 
          <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Médicos</span>
        </a>
        <a href="consultas.html" class="py-3 rounded-lg flex items-center gap-4 font-medium transition-all duration-300 mx-3 px-3 text-slate-400 hover:text-white">
          <i class="ph ph-calendar-blank text-xl shrink-0"></i> 
          <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Consultas</span>
        </a>
        <a href="admin-users.html" class="py-3 rounded-lg flex items-center gap-4 font-medium transition-all duration-300 mx-3 px-3 bg-[#4f46e5] text-white admin-only">
          <i class="ph ph-shield text-xl shrink-0"></i> 
          <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Admin</span>
        </a>
      </nav>
    </div>
    <div class="p-4 mb-4 w-[240px]">
      <button class="w-[calc(100%-1.5rem)] px-3 py-3 rounded-lg text-slate-400 hover:text-white flex items-center gap-4 font-medium transition mx-3" onclick="logout()">
        <i class="ph ph-sign-out text-xl shrink-0"></i> 
        <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Sair</span>
      </button>
    </div>
  </aside>

  <main class="flex-1 flex flex-col p-8 overflow-y-auto gap-4 relative">
        <header class="flex justify-between items-center mb-8 px-2 mt-4">
      <div>
        <h1 class="text-3xl font-bold text-white tracking-tight">Gestão de Utilizadores</h1>
        <p class="text-sm text-slate-400 mt-2">Gerencie o acesso e as credenciais do sistema.</p>
      </div>
      <div class="flex items-center gap-4">
        
        <button class="w-10 h-10 rounded-full bg-[#1e1e32] border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition">
          <i class="ph ph-bell text-lg"></i>
        </button>
      </div>
    </header>
    
    <div class="content-panel flex-1 overflow-y-auto">

                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <select id="filter-role" class="form-control" style="width: 200px;">
                        <option value="">Todas as Roles</option>
                        <option value="admin">Administrador</option>
                        <option value="medico">Médico</option>
                        <option value="paciente">Paciente</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <tr><td colspan="5" style="text-align: center;">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination-container" id="pagination-users"></div>
            </div>
        </main>

    <!-- Modal Novo/Editar Utilizador -->
    <div class="modal-overlay" id="userModal">
        <div class="modal-container" style="max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
                <h3 id="modal-title">Novo Utilizador</h3>
                <button class="modal-close"><i data-lucide="x"></i></button>
            </div>
            <form id="formUser">
                <input type="hidden" id="u_id">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Role</label>
                        <select id="u_role" class="form-control" required>
                            <option value="admin">Administrador</option>
                            <option value="medico">Médico</option>
                            <option value="paciente" selected>Paciente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" id="u_nome" class="form-control" required placeholder="Nome Completo">
                    </div>
                    <div class="form-group">
                        <label class="form-label">E-mail</label>
                        <input type="email" id="u_email" class="form-control" required placeholder="usuario@exemplo.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Senha</label>
                        <input type="password" id="u_senha" class="form-control" placeholder="Deixe em branco para não alterar (na edição)">
                    </div>
                    <div class="form-group" id="status-group" style="display: none;">
                        <label class="form-label">Ativo</label>
                        <input type="checkbox" id="u_is_active">
                    </div>
                    
                    <!-- Campos Paciente -->
                    <div class="dynamic-field role-paciente">
                        <div class="form-group">
                            <label class="form-label">CPF</label>
                            <input type="text" id="u_cpf" class="form-control" placeholder="000.000.000-00">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Data de Nascimento</label>
                            <input type="date" id="u_data_nascimento" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Telefone</label>
                            <input type="text" id="u_telefone_paciente" class="form-control" placeholder="(00) 00000-0000">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Endereço</label>
                            <input type="text" id="u_endereco" class="form-control" placeholder="Endereço">
                        </div>
                    </div>

                    <!-- Campos Médico -->
                    <div class="dynamic-field role-medico">
                        <div class="form-group">
                            <label class="form-label">CRM</label>
                            <input type="text" id="u_crm" class="form-control" placeholder="CRM">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Especialidade</label>
                            <input type="text" id="u_especialidade" class="form-control" placeholder="Cardiologia">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Telefone</label>
                            <input type="text" id="u_telefone_medico" class="form-control" placeholder="(00) 00000-0000">
                        </div>
                    </div>
                    
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-close-btn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        lucide.createIcons();
        
        // Verifica admin role client-side
        const tokenInfo = localStorage.getItem('token');
        if (tokenInfo) {
            try {
                const payload = JSON.parse(atob(tokenInfo.split('.')[1]));
                if (payload.role !== 'admin') {
                    window.location.href = 'dashboard.html';
                }
            } catch(e) {}
        }

        const limit = 10;
        let currentPage = 1;

        async function carregarUsers(pagina = 1) {
            const token = localStorage.getItem('token');
            if (!token) return;

            currentPage = pagina;
            const skip = (pagina - 1) * limit;
            const roleFilter = document.getElementById('filter-role').value;

            try {
                const response = await window.api.getUsers(skip, limit, roleFilter);
                const users = response.items;
                const total = response.total;

                const tbody = document.getElementById('users-table-body');
                tbody.innerHTML = '';
                
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Nenhum utilizador encontrado.</td></tr>';
                } else {
                    users.forEach(u => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>
                                <div style="display: flex; align-items: center; gap: 0.75rem;">
                                    <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--primary-light); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold;">
                                        ${u.nome.charAt(0).toUpperCase()}
                                    </div>
                                    <span style="font-weight: 500; color: white;">${u.nome}</span>
                                </div>
                            </td>
                            <td>${u.email}</td>
                            <td><span style="padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; background: var(--primary-light); color: white;">${u.role.toUpperCase()}</span></td>
                            <td>${u.is_active ? '<span style="color: var(--success-text);">Ativo</span>' : '<span style="color: var(--error-text);">Inativo</span>'}</td>
                            <td>
                                <button class="btn-icon" title="Editar" onclick="abrirEdicao(${u.id}, '${u.nome}', '${u.email}', '${u.role}', ${u.is_active})">
                                    <i data-lucide="edit-2" style="width:16px;height:16px;"></i>
                                </button>
                                <button class="btn-icon" style="color: var(--error-text);" title="Excluir" onclick="excluirUser(${u.id})">
                                    <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
                
                window.renderPagination('pagination-users', total, limit, currentPage, carregarUsers);
            } catch (error) {
                console.error(error);
                showToast('Erro ao carregar utilizadores', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarUsers();
            
            document.getElementById('filter-role').addEventListener('change', () => {
                carregarUsers(1);
            });
            
            document.getElementById('u_role').addEventListener('change', toggleDynamicFields);
        });

        // Modal Logic
        const modal = document.getElementById('userModal');
        const form = document.getElementById('formUser');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtns = document.querySelectorAll('.modal-close, .modal-close-btn');

        function toggleDynamicFields() {
            const role = document.getElementById('u_role').value;
            document.querySelectorAll('.dynamic-field').forEach(el => el.style.display = 'none');
            
            // Somente mostramos os campos extras na criação (id vazio)
            if(!document.getElementById('u_id').value) {
                if(role === 'paciente') document.querySelector('.role-paciente').style.display = 'block';
                if(role === 'medico') document.querySelector('.role-medico').style.display = 'block';
            }
        }

        openBtn.addEventListener('click', () => {
            form.reset();
            document.getElementById('u_id').value = '';
            document.getElementById('modal-title').textContent = 'Novo Utilizador';
            document.getElementById('status-group').style.display = 'none';
            document.getElementById('u_senha').required = true;
            document.getElementById('u_role').disabled = false;
            toggleDynamicFields();
            modal.classList.add('active');
        });
        
        closeBtns.forEach(btn => btn.addEventListener('click', () => {
            modal.classList.remove('active');
        }));

        window.abrirEdicao = function(id, nome, email, role, isActive) {
            form.reset();
            document.getElementById('u_id').value = id;
            document.getElementById('u_nome').value = nome;
            document.getElementById('u_email').value = email;
            document.getElementById('u_role').value = role;
            document.getElementById('u_is_active').checked = isActive;
            
            document.getElementById('modal-title').textContent = 'Editar Utilizador';
            document.getElementById('status-group').style.display = 'block';
            document.getElementById('u_senha').required = false;
            document.getElementById('u_role').disabled = true; // não deixa trocar role
            toggleDynamicFields(); // oculta os campos dinâmicos pois já existem ou não deveriam ser criados na edição da user base
            modal.classList.add('active');
        };
        
        window.excluirUser = async function(id) {
            if(confirm('Deseja realmente excluir este utilizador? Esta ação não pode ser desfeita.')) {
                try {
                    await window.api.deleteUserAdmin(id);
                    showToast('Utilizador excluído.', 'success');
                    carregarUsers(currentPage);
                } catch(e) {
                    showToast(e.message, 'error');
                }
            }
        };

        function validarCpfMatematicamente(cpf) {
            cpf = cpf.replace(/[^\d]+/g,'');
            if(cpf === '') return false;
            if(cpf.length !== 11) return false;
            if (/^(\d)\1{10}$/.test(cpf)) return false; // todos iguais
            
            let add = 0;
            for (let i = 0; i < 9; i ++) add += parseInt(cpf.charAt(i)) * (10 - i);
            let rev = 11 - (add % 11);
            if (rev === 10 || rev === 11) rev = 0;
            if (rev !== parseInt(cpf.charAt(9))) return false;
            
            add = 0;
            for (let i = 0; i < 10; i ++) add += parseInt(cpf.charAt(i)) * (11 - i);
            rev = 11 - (add % 11);
            if (rev === 10 || rev === 11) rev = 0;
            if (rev !== parseInt(cpf.charAt(10))) return false;
            
            return true;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('u_id').value;
            const isEditing = !!id;
            const role = document.getElementById('u_role').value;
            
            // Validação de CPF para paciente novo
            if(!isEditing && role === 'paciente') {
                const cpfRaw = document.getElementById('u_cpf').value;
                if(!validarCpfMatematicamente(cpfRaw)) {
                    showToast('CPF Inválido!', 'error');
                    return;
                }
            }

            const payload = {
                nome: document.getElementById('u_nome').value,
                email: document.getElementById('u_email').value,
                role: role
            };
            
            const senha = document.getElementById('u_senha').value;
            if(senha) payload.password = senha;

            try {
                if (isEditing) {
                    payload.is_active = document.getElementById('u_is_active').checked;
                    await window.api.updateUserAdmin(id, payload);
                    showToast('Utilizador atualizado!', 'success');
                } else {
                    if (role === 'paciente') {
                        payload.cpf = document.getElementById('u_cpf').value;
                        payload.data_nascimento = document.getElementById('u_data_nascimento').value;
                        payload.telefone = document.getElementById('u_telefone_paciente').value;
                        payload.endereco = document.getElementById('u_endereco').value;
                    } else if (role === 'medico') {
                        payload.crm = document.getElementById('u_crm').value;
                        payload.especialidade = document.getElementById('u_especialidade').value;
                        payload.telefone = document.getElementById('u_telefone_medico').value;
                    }
                    await window.api.createUserAdmin(payload);
                    showToast('Utilizador criado!', 'success');
                }
                modal.classList.remove('active');
                carregarUsers(currentPage);
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    </script>
</body>
</html>
