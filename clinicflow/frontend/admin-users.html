    .table { width: 100%; border-collapse: collapse; }

    .badge-success { background: rgba(16,185,129,0.15); color: #34d399; font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 99px; font-weight: 600; }
    .badge-error { background: rgba(244,63,94,0.15); color: #fb7185; font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 99px; font-weight: 600; }
    
    .form-control { background: #0b1221; border: 1px solid #1e293b; color: white; padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.85rem; width: 100%; transition: 0.2s; }
    .form-control:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    
    .modal-container { background: #131c31; color: #e2e8f0; border: 1px solid #1e293b; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .modal-header { border-bottom: 1px solid #1e293b; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .modal-footer { border-top: 1px solid #1e293b; padding: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem; }
    
    .btn-secondary { background: transparent; color: #94a3b8; border: 1px solid #334155; padding: 0.5rem 1rem; border-radius: 0.75rem; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
    .btn-secondary:hover { background: #1e293b; color: white; }
    .btn-primary { background: #3b82f6; color: white; border: none; padding: 0.5rem 1.25rem; border-radius: 0.75rem; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
    .btn-primary:hover { background: #2563eb; }
    
    label.form-label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; font-weight: 500; }
  </style>
</head>
<body class="h-screen overflow-hidden flex">

    <div class="h-24 flex items-center px-6 overflow-hidden">
      <div class="flex items-center">
        <i class="ph-fill ph-heartbeat text-4xl text-blue-500 shrink-0"></i>
        <div class="flex flex-col">
          <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 text-white font-bold text-xl leading-tight">Clínica Vida</span><span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 text-[0.65rem] text-slate-400 font-semibold tracking-widest">GESTÃO DE SAÚDE</span>
        </div>

    <nav class="flex flex-col gap-2 mt-4 flex-1">
      <a href="dashboard.html" class="sidebar-item"><i class="ph ph-house text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Início</span></a>
      <a href="pacientes.html" class="sidebar-item"><i class="ph ph-users text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Pacientes</span></a>
      <a href="medicos.html" class="sidebar-item"><i class="ph ph-user-circle-plus text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Médicos</span></a>
      <a href="consultas.html" class="sidebar-item"><i class="ph ph-calendar-plus text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Consultas</span></a>
      
      <a href="relatorios.html" class="sidebar-item admin-only"><i class="ph ph-chart-bar text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Relatórios</span></a>
      <a href="admin-users.html" class="sidebar-item active admin-only"><i class="ph ph-shield text-xl shrink-0"></i> <span class="max-w-0 opacity-0 group-hover:max-w-[200px] group-hover:opacity-100 transition-all duration-300 overflow-hidden whitespace-nowrap group-hover:ml-3 flex-1">Admin</span></a>
    </nav>
    
    <div class="p-6">
      <button onclick="logout()" class="sidebar-item !mx-0 !px-0 flex items-center gap-3 w-full text-left">
        <i class="ph ph-sign-out text-2xl text-slate-400 shrink-0"></i>
        <div class="flex flex-col">
          <span class="text-white font-medium text-sm opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Sair</span>
          <span class="text-xs text-slate-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Encerrar sessão</span>
        </div>
      </button>

  <!-- MAIN AREA -->
  <div class="flex-1 flex flex-col overflow-hidden bg-[#0b1221]">
    
    <!-- TOP HEADER -->
    <header class="h-20 px-8 flex items-center justify-between shrink-0">
      <div class="relative">
        <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 shrink-0"></i>
        <input type="text" placeholder="Buscar..." class="w-[300px] bg-[#131c31] border border-[#1e293b] rounded-full py-2 pl-12 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
      </div>
      
      <div class="flex items-center gap-6">
        <button class="relative text-slate-400 hover:text-white transition">
          <i class="ph ph-bell text-2xl shrink-0"></i>
        </button>
        <div class="flex items-center gap-3 border-l border-[#1e293b] pl-6 cursor-pointer">
          <div class="w-10 h-10 rounded-full bg-cyan-400 text-slate-900 flex items-center justify-center font-bold text-lg" id="avatar-initial">U</div>
        </div>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="flex-1 overflow-y-auto p-8 pt-2 flex flex-col gap-6 relative">
      <div class="flex justify-between items-center shrink-0">
        <div>
          <h1 class="text-3xl font-bold text-white tracking-tight">Gestão de Utilizadores</h1>
          <p class="text-sm text-slate-400 mt-1">Gerencie o acesso e as credenciais do sistema.</p>
        </div>
        <div>
          
        </div>
      </div>
      
      <div class="dark-card flex-1 flex flex-col overflow-hidden">
        <div class="overflow-y-auto flex-1">
          

                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <select id="filter-role" class="form-control" style="width: 200px;">
                        <option value="">Todas as Roles</option>
                        <option value="admin">Administrador</option>
                        <option value="medico">Médico</option>
                        <option value="paciente">Paciente</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <tr><td colspan="5" style="text-align: center;">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination-container" id="pagination-users"></div>
            
        </div>
      </div>
    </main>
  </div>
  
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    
        
        
        // Verifica admin role client-side
        const tokenInfo = localStorage.getItem('token');
        if (tokenInfo) {
            try {
                const payload = JSON.parse(atob(tokenInfo.split('.')[1]));
                if (payload.role !== 'admin') {
                    window.location.href = 'dashboard.html';
                }
            } catch(e) {}
        }

        const limit = 10;
        let currentPage = 1;

        async function carregarUsers(pagina = 1) {
            const token = localStorage.getItem('token');
            if (!token) return;

            currentPage = pagina;
            const skip = (pagina - 1) * limit;
            const roleFilter = document.getElementById('filter-role').value;

            try {
                const response = await window.api.getUsers(skip, limit, roleFilter);
                const users = response.items;
                const total = response.total;

                const tbody = document.getElementById('users-table-body');
                tbody.innerHTML = '';
                
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Nenhum utilizador encontrado.</td></tr>';
                } else {
                    users.forEach(u => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>
                                <div style="display: flex; align-items: center; gap: 0.75rem;">
                                    <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--primary-light); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold;">
                                        ${u.nome.charAt(0).toUpperCase()}
                                    </div>
                                    <span style="font-weight: 500; color: white;">${u.nome}</span>
                                </div>
                            </td>
                            <td>${u.email}</td>
                            <td><span style="padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; background: var(--primary-light); color: white;">${u.role.toUpperCase()}</span></td>
                            <td>${u.is_active ? '<span style="color: var(--success-text);">Ativo</span>' : '<span style="color: var(--error-text);">Inativo</span>'}</td>
                            <td>
                                <button class="btn-icon" title="Editar" onclick="abrirEdicao(${u.id}, '${u.nome}', '${u.email}', '${u.role}', ${u.is_active})">
                                    <i class="ph ph- shrink-0"edit-2" style="width:16px;height:16px;"></i>
                                </button>
                                <button class="btn-icon" style="color: var(--error-text);" title="Excluir" onclick="excluirUser(${u.id})">
                                    <i class="ph ph-trash shrink-0" style="width:16px;height:16px;"></i>
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
                
                window.renderPagination('pagination-users', total, limit, currentPage, carregarUsers);
            } catch (error) {
                console.error(error);
                showToast('Erro ao carregar utilizadores', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarUsers();
            
            document.getElementById('filter-role').addEventListener('change', () => {
                carregarUsers(1);
            });
            
            document.getElementById('u_role').addEventListener('change', toggleDynamicFields);
        });

        // Modal Logic
        const modal = document.getElementById('userModal');
        const form = document.getElementById('formUser');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtns = document.querySelectorAll('.modal-close, .modal-close-btn');

        function toggleDynamicFields() {
            const role = document.getElementById('u_role').value;
            document.querySelectorAll('.dynamic-field').forEach(el => el.style.display = 'none');
            
            // Somente mostramos os campos extras na criação (id vazio)
            if(!document.getElementById('u_id').value) {
                if(role === 'paciente') document.querySelector('.role-paciente').style.display = 'block';
                if(role === 'medico') document.querySelector('.role-medico').style.display = 'block';
            }
        }

        openBtn.addEventListener('click', () => {
            form.reset();
            document.getElementById('u_id').value = '';
            document.getElementById('modal-title').textContent = 'Novo Utilizador';
            document.getElementById('status-group').style.display = 'none';
            document.getElementById('u_senha').required = true;
            document.getElementById('u_role').disabled = false;
            toggleDynamicFields();
            modal.classList.add('active');
        });
        
        closeBtns.forEach(btn => btn.addEventListener('click', () => {
            modal.classList.remove('active');
        }));

        window.abrirEdicao = function(id, nome, email, role, isActive) {
            form.reset();
            document.getElementById('u_id').value = id;
            document.getElementById('u_nome').value = nome;
            document.getElementById('u_email').value = email;
            document.getElementById('u_role').value = role;
            document.getElementById('u_is_active').checked = isActive;
            
            document.getElementById('modal-title').textContent = 'Editar Utilizador';
            document.getElementById('status-group').style.display = 'block';
            document.getElementById('u_senha').required = false;
            document.getElementById('u_role').disabled = true; // não deixa trocar role
            toggleDynamicFields(); // oculta os campos dinâmicos pois já existem ou não deveriam ser criados na edição da user base
            modal.classList.add('active');
        };
        
        window.excluirUser = async function(id) {
            if(confirm('Deseja realmente excluir este utilizador? Esta ação não pode ser desfeita.')) {
                try {
                    await window.api.deleteUserAdmin(id);
                    showToast('Utilizador excluído.', 'success');
                    carregarUsers(currentPage);
                } catch(e) {
                    showToast(e.message, 'error');
                }
            }
        };

        function validarCpfMatematicamente(cpf) {
            cpf = cpf.replace(/[^\d]+/g,'');
            if(cpf === '') return false;
            if(cpf.length !== 11) return false;
            if (/^(\d)\1{10}$/.test(cpf)) return false; // todos iguais
            
            let add = 0;
            for (let i = 0; i < 9; i ++) add += parseInt(cpf.charAt(i)) * (10 - i);
            let rev = 11 - (add % 11);
            if (rev === 10 || rev === 11) rev = 0;
            if (rev !== parseInt(cpf.charAt(9))) return false;
            
            add = 0;
            for (let i = 0; i < 10; i ++) add += parseInt(cpf.charAt(i)) * (11 - i);
            rev = 11 - (add % 11);
            if (rev === 10 || rev === 11) rev = 0;
            if (rev !== parseInt(cpf.charAt(10))) return false;
            
            return true;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('u_id').value;
            const isEditing = !!id;
            const role = document.getElementById('u_role').value;
            
            // Validação de CPF para paciente novo
            if(!isEditing && role === 'paciente') {
                const cpfRaw = document.getElementById('u_cpf').value;
                if(!validarCpfMatematicamente(cpfRaw)) {
                    showToast('CPF Inválido!', 'error');
                    return;
                }
            }

            const payload = {
                nome: document.getElementById('u_nome').value,
                email: document.getElementById('u_email').value,
                role: role
            };
            
            const senha = document.getElementById('u_senha').value;
            if(senha) payload.password = senha;

            try {
                if (isEditing) {
                    payload.is_active = document.getElementById('u_is_active').checked;
                    await window.api.updateUserAdmin(id, payload);
                    showToast('Utilizador atualizado!', 'success');
                } else {
                    if (role === 'paciente') {
                        payload.cpf = document.getElementById('u_cpf').value;
                        payload.data_nascimento = document.getElementById('u_data_nascimento').value;
                        payload.telefone = document.getElementById('u_telefone_paciente').value;
                        payload.endereco = document.getElementById('u_endereco').value;
                    } else if (role === 'medico') {
                        payload.crm = document.getElementById('u_crm').value;
                        payload.especialidade = document.getElementById('u_especialidade').value;
                        payload.telefone = document.getElementById('u_telefone_medico').value;
                    }
                    await window.api.createUserAdmin(payload);
                    showToast('Utilizador criado!', 'success');
                }
                modal.classList.remove('active');
                carregarUsers(currentPage);
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    
  </script>
</body>
</html>
